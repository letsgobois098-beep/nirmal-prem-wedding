<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 70" width="70" height="70">
  <defs>
    <style>
      .monogram-text {
        font-family: 'Playfair Display', Georgia, serif;
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 0.05em;
        fill: #680C1D;
      }
      .year-text {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 7.5px;
        font-weight: 700;
        letter-spacing: 0.18em;
        fill: #9E7D56;
      }
    </style>
  </defs>

  <!-- Outer Ring -->
  <circle cx="35" cy="35" r="33" fill="#FAF9F6" stroke="#680C1D" stroke-width="1.8" />
  
  <!-- Subtle Dotted Gold Inlay -->
  <circle cx="35" cy="35" r="29.5" fill="none" stroke="#C5A880" stroke-width="0.9" stroke-dasharray="2.5,2" />
  
  <!-- Subtle Inner Hairline -->
  <circle cx="35" cy="35" r="27" fill="none" stroke="#680C1D" stroke-width="0.5" opacity="0.3" />

  <!-- Monogram -->
  <text x="35" y="40" class="monogram-text" text-anchor="middle">NP</text>
  
  <!-- Heritage Year Arc -->
  <text x="35" y="52" class="year-text" text-anchor="middle">1948</text>
</svg>
